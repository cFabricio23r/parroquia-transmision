<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rótulos – Parroquia</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="escenario" id="escenario">
  <div class="no-existe" id="no-existe" hidden>Esta parroquia no existe, revisa el link</div>
  <div class="capa-logo" id="logo">
    <img id="logo-img" alt="" hidden>
    <div class="multilinea" id="logo-txt"></div>
  </div>
  <div class="envivo capa-envivo" id="envivo"><i></i>EN VIVO</div>
  <!-- Mientras hay rótulo (logoEsquina): el logo blanco solo, sin la caja de la capa (F6:24) -->
  <img class="logo-esquina oculto" id="logo-esquina" alt="" hidden>

  <div class="barra" id="barra"><span class="x" id="barra-x"></span><span class="y" id="barra-y"></span></div>

  <div class="rotulo" id="rotulo">
    <div class="lado"><img id="lado-logo" alt="" hidden></div>
    <div class="cuerpo">
      <span class="k" id="r-k"></span>
      <span class="t" id="r-t"></span>
      <span class="s" id="r-s"></span>
    </div>
  </div>
</div>

<script src="parroquia.js"></script>
<script src="tipos.js"></script>
<script src="comun.js"></script>
<script src="pantallas.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let estado = leerEstado();

/* Texto del rótulo elegido; null si s.rotulo no es un rótulo del tipo activo (el rótulo se oculta). */
function contenido(s) {
  const r = rotulosDe(s).find((x) => x.id === s.rotulo);
  return r ? r.texto : null;
}

/* Tamaño del nombre según la tipografía, para que todas se vean del mismo alto. Montserrat es 52; Lora, 54 (F6:24). */
const TAMANO_NOMBRE = { lora: 54, cinzel: 46, playfair: 54, 'eb-garamond': 58, merriweather: 48, nunito: 52, oswald: 58 };

/* ----- máquina de animación del rótulo ----- */
const R = $('rotulo');
let mostrando = null;      // tipo de rótulo que está en pantalla
let ocupado = false, pendiente = null;

function ponerTexto(c, animar) {
  const pares = [['r-k', c.k], ['r-t', c.t || ''], ['r-s', c.s || '']];
  pares.forEach(([id, val]) => {
    const el = $(id);
    if (el.textContent !== val) {
      el.textContent = val;
      if (animar) { el.classList.remove('cambia'); void el.offsetWidth; el.classList.add('cambia'); }
    }
  });
  ajustarTexto($('r-t'), 1390, c.chico ? 46 : (TAMANO_NOMBRE[estiloRotulos().tipografia] || 52), 28);
}

function entrar(tipo, c) {
  ponerTexto(c, false);
  R.classList.remove('sale', 'en'); void R.offsetWidth; R.classList.add('en');
  mostrando = tipo;
}

function salir(despues) {
  ocupado = true;
  R.classList.remove('en'); R.classList.add('sale');
  setTimeout(() => {
    R.classList.remove('sale'); mostrando = null; ocupado = false;
    if (despues) despues();
    if (pendiente) { const p = pendiente; pendiente = null; aplicar(p); }
  }, 430);
}

function aplicar(s) {
  if (ocupado) { pendiente = s; return; }
  const c = contenido(s);
  const vence = s.rotuloHasta && Date.now() > s.rotuloHasta;
  const tipo = (c && !vence) ? s.rotulo : null;

  if (!tipo) { if (mostrando) salir(); return; }
  if (!mostrando) { entrar(tipo, c); return; }
  if (mostrando === tipo) { ponerTexto(c, true); return; }      // mismo rótulo: solo cambia el texto
  salir(() => entrar(tipo, contenido(s)));                       // otro rótulo: sale y entra el nuevo
}

function pintar(s) {
  if (PARROQUIA_NO_EXISTE) return;
  estado = s;
  const hayRotulo = !!contenido(s) && !(s.rotuloHasta && Date.now() > s.rotuloHasta);
  // La capa EN VIVO se personaliza con pantallas.envivo: marca y EN VIVO ocultables, textos propios.
  // Mientras hay rótulo la capa del logo se aparta; con logoEsquina queda el logo blanco solo en la esquina (F6:24).
  const conMarca = s.mostrarLogo && visible('envivo', 'marca');
  $('logo').classList.toggle('oculto', !conMarca || hayRotulo);
  $('logo-esquina').classList.toggle('oculto', !(conMarca && hayRotulo && estiloRotulos().logoEsquina));
  $('envivo').classList.toggle('oculto', !s.mostrarEnVivo || !visible('envivo', 'envivo'));
  $('logo-txt').textContent = textoDe(s, 'envivo', 'capa_logo');

  aplicar(s);

  $('barra-x').textContent = (s.barraTexto || '').trim() || tituloCelebracion(s);
  $('barra-y').textContent = textoDe(s, 'envivo', 'barra_y');
  $('barra').classList.toggle('oculto', !s.mostrarBarra || hayRotulo);
}

/* La configuración de la parroquia manda: colores, logo y el aviso de «no existe». */
function aplicarParroquia(c) {
  const no = PARROQUIA_NO_EXISTE;
  $('escenario').classList.toggle('sin-parroquia', no);
  $('no-existe').hidden = !no;
  if (no) return;
  aplicarPaleta(c);
  const e = estiloRotulos();   // clases, --lado y --linea se reponen en cada cambio y se quitan al volver a lo de siempre
  const esc = $('escenario');
  // Solo los valores que no son los de hoy llevan clase: Montserrat y suaves (también 'redondeadas', que es lo mismo)
  // no agregan nada; rectas y redondas sí.
  TIPOGRAFIAS.forEach((t) => esc.classList.toggle('tipo-' + t, t !== 'montserrat' && e.tipografia === t));
  ESQUINAS_ROTULO.forEach((q) => esc.classList.toggle('esquinas-' + q, (q === 'rectas' || q === 'redondas') && e.esquinas === q));
  esc.classList.toggle('pos-centro', e.posicion === 'centro');
  if (e.colorLado) esc.style.setProperty('--lado', e.colorLado);
  else esc.style.removeProperty('--lado');
  if (e.colorLinea) esc.style.setProperty('--linea', e.colorLinea);
  else esc.style.removeProperty('--linea');
  ponerImagen($('logo-img'), c.logos && c.logos.blanco);
  ponerImagen($('logo-esquina'), c.logos && c.logos.blanco);
  // Sobre un lateral claro el logo blanco no se ve: va el de color, si la parroquia lo tiene.
  ponerImagen($('lado-logo'), c.logos && (e.ladoClaro && c.logos.color ? c.logos.color : c.logos.blanco));
  pintar(leerEstado());   // mismo rótulo y mismo texto: no se reanima
}
aplicarParroquia(PARROQUIA);
alCambiarParroquia(aplicarParroquia);
vigilarParroquia();
escucharEstado(pintar);
setInterval(() => { if (estado.rotuloHasta) pintar(estado); }, 250);
latir('rotulos');
</script>
</body>
</html>
