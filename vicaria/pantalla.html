<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pantalla – Parroquia</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="escenario" id="escenario">
<div class="no-existe" id="no-existe" hidden>Esta parroquia no existe, revisa el link</div>
<div class="lienzo" id="lienzo">
  <img class="fondo-img" id="fondo-img" alt="" hidden>
  <div class="brillo"></div>
  <img class="fachada" id="fachada" alt="" hidden>
  <div class="rayos"></div>
  <div id="chispas"></div>
  <img class="virgen virgen-entra" id="virgen" alt="" hidden>

  <div class="marca" id="marca">
    <img id="marca-logo" alt="" hidden>
    <div class="multilinea" id="t-marca"></div>
  </div>
  <div class="envivo" id="envivo"><i></i>EN VIVO</div>

  <!-- INICIO: en breve comenzamos -->
  <div class="texto" id="v-inicio" hidden>
    <span class="pildora" id="i-pildora"></span>
    <p class="ceja" id="i-ceja"></p>
    <h1 class="titulo"><span class="brilla multilinea" id="i-titulo"></span></h1>
    <p class="cursiva multilinea" id="i-cursiva"></p>
    <div class="cuenta" id="i-cuenta"><b id="i-dias"></b><span class="multilinea" id="i-cuenta-txt"></span></div>
    <div class="salida" id="i-salida" hidden><span>SALIDA</span><span id="i-salida-lugar"></span></div>
  </div>

  <!-- PORTADA 8 DE DICIEMBRE -->
  <div class="texto" id="v-portada" hidden style="gap:14px;top:140px">
    <p class="ceja" id="p-ceja" style="font-size:28px;letter-spacing:9px;margin:0"></p>
    <p class="cursiva" id="p-cursiva" style="font-size:84px;line-height:1;margin:0"></p>
    <h1 class="titulo" style="font-size:112px"><span class="brilla multilinea" id="p-titulo"></span></h1>
    <div class="dia8">
      <div class="caja" id="p-caja"><b id="p-caja-num">8</b><span id="p-caja-mes">DIC</span></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-weight:900;font-size:52px;letter-spacing:2px;line-height:1" id="p-fecha"></span>
        <span style="font-weight:600;font-size:26px;color:#bfe0ff" id="p-sub"></span>
      </div>
    </div>
  </div>

  <!-- Portada de evento: logo grande dentro de un aro (en lugar de la imagen de la celebración) -->
  <div class="aro" id="p-aro" hidden><img id="aro-logo" alt="" hidden></div>

  <!-- GRACIAS -->
  <div class="texto" id="v-gracias" hidden>
    <span class="pildora" id="g-pildora"></span>
    <h1 class="titulo" style="font-size:88px;line-height:1;letter-spacing:-1px;margin-top:10px"><span class="brilla multilinea" id="g-titulo"></span></h1>
    <p class="cursiva multilinea" style="font-size:60px" id="g-cursiva"></p>
    <p class="ceja" style="font-size:26px;letter-spacing:6px" id="g-ceja"></p>
  </div>

  <!-- AVISOS -->
  <div class="tarjeta" id="v-avisos" hidden>
    <div class="cab">
      <div><div class="sub" id="a-sub"></div><h1 id="a-titulo"></h1></div>
      <div style="display:flex;align-items:center;gap:16px">
        <img id="a-logo" alt="" style="height:78px;display:block" hidden>
        <span class="envivo" style="position:static;font-size:22px;box-shadow:none"><i></i>EN VIVO</span>
      </div>
    </div>
    <div class="filas" id="a-filas"></div>
  </div>

  <!-- HORARIOS DE MISA (y redes: solo el texto, OBS no hace clic) -->
  <div class="tarjeta" id="v-horarios" hidden>
    <div class="cab">
      <div><div class="sub" id="h-sub"></div><h1 id="h-titulo"></h1></div>
      <div style="display:flex;align-items:center;gap:16px">
        <img id="h-logo" alt="" style="height:78px;display:block" hidden>
        <span class="envivo" style="position:static;font-size:22px;box-shadow:none"><i></i>EN VIVO</span>
      </div>
    </div>
    <div class="filas" id="h-filas"></div>
    <div class="redes" id="h-redes"></div>
  </div>

  <div class="franja-entra" style="position:absolute;left:0;right:0;bottom:0;height:102px">
    <div class="franja-linea"></div>
    <div class="franja">
      <div class="borde"></div>
      <div class="frase"><i>✦</i><span id="frase"></span><i>✦</i></div>
      <div class="fecha" id="f-fecha"><b id="f-num"></b><span class="multilinea" id="f-txt"></span></div>
    </div>
  </div>
</div>
</div>

<script src="parroquia.js"></script>
<script src="tipos.js"></script>
<script src="comun.js"></script>
<script src="pantallas.js"></script>
<script>
const vista = (new URLSearchParams(location.search).get('tipo') || 'inicio').toLowerCase();
const $ = (id) => document.getElementById(id);
if (vista === 'avisos' || vista === 'horarios') { document.body.classList.add(vista); $('marca').style.display = 'none'; $('envivo').style.display = 'none'; }

/* Vista que se pinta de verdad: la portada solo existe para los tipos que la traen en tipos.js
   (portada: 'fiesta' | 'evento'); los demás pintan en ella la vista de Inicio. La URL no cambia. */
function vistaDe(s) {
  return vista === 'portada' && !tipoDe(s).portada ? 'inicio' : vista;
}

/* La imagen se pide una sola vez: si no carga (custodia.png, patrono…) cae a la fachada de la parroquia y no
   vuelve a intentarlo; si la fachada tampoco carga, la imagen se oculta y queda el degradado de los colores. */
function clasificarImagen(v) {
  v.classList.remove('a', 'b', 'c', 'foto', 'logo');
  v.classList.add(claseDeImagen(v.getAttribute('src') || ''));   // foto (fachada) | logo | a (vertical)
}
$('virgen').addEventListener('error', () => {
  const v = $('virgen');
  const r = respaldoDeImagen(v.getAttribute('src') || '');
  if (!r) { v.dataset.fallo = '1'; v.hidden = true; return; }
  v.setAttribute('src', r.src);
  v.alt = r.alt;
  clasificarImagen(v);
});

/* chispas de luz que suben despacio */
(function () {
  const caja = $('chispas');
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('span');
    c.className = 'chispa';
    c.textContent = i % 3 === 0 ? '✦' : '•';
    c.style.left = (Math.random() * 1900) + 'px';
    c.style.top = (300 + Math.random() * 700) + 'px';
    c.style.fontSize = (i % 3 === 0 ? 12 + Math.random() * 14 : 8 + Math.random() * 10) + 'px';
    c.style.animationDuration = (9 + Math.random() * 10) + 's';
    c.style.animationDelay = (-Math.random() * 18) + 's';
    caja.append(c);
  }
})();

let firmaAnterior = '';
const NOMBRES_RED = { facebook: 'Facebook', youtube: 'YouTube', instagram: 'Instagram', whatsapp: 'WhatsApp', web: 'Web' };
function reanimar(el) { el.classList.remove('entra'); void el.offsetWidth; el.classList.add('entra'); }

function pintar(s) {
  if (PARROQUIA_NO_EXISTE) return;
  const tipo = tipoDe(s);
  const efectiva = vistaDe(s);
  // Ajustes, fondo y textos son los de la vista que se pinta de verdad: si la portada pinta Inicio, los del bloque `inicio`.
  const T = (clave) => textoDe(s, efectiva, clave);
  aplicarAjustes(efectiva);
  const esPortadaEvento = efectiva === 'portada' && tipo.portada === 'evento';
  ['inicio', 'portada', 'gracias', 'avisos', 'horarios'].forEach((n) => { const el = $('v-' + n); if (el) el.hidden = (n !== efectiva); });

  const v = $('virgen');
  const im = imagenDeVista(s, efectiva);
  const src = im.src;
  if (v.dataset.pedida !== src) {
    v.dataset.pedida = src; v.dataset.fallo = '';
    if (src) v.setAttribute('src', src); else v.removeAttribute('src');
    clasificarImagen(v);
    v.classList.remove('virgen-entra'); void v.offsetWidth; v.classList.add('virgen-entra');
  }
  if (v.getAttribute('src') === src || !src) v.alt = im.alt;   // el alt se refresca en cada pintada (no si la imagen cayó a la fachada)
  // la portada de evento lleva el logo grande en su lugar; sin imagen (elección «ninguna» incluida) o con la imagen rota no se muestra nada
  v.hidden = esPortadaEvento || !v.getAttribute('src') || v.dataset.fallo === '1';
  $('p-aro').hidden = !esPortadaEvento;

  const franja = T('franja');
  $('frase').textContent = franja;
  $('frase').parentNode.style.visibility = franja ? '' : 'hidden';   // sin lema no hay franja (el espacio se conserva)
  $('t-marca').textContent = T('marca');
  const esq = esquinaDe(s);                  // { num, txt }: sin número solo se ve el texto
  $('f-num').textContent = esq.num;
  $('f-num').hidden = !esq.num;
  $('f-txt').textContent = esq.txt;
  $('f-fecha').classList.toggle('solo-texto', !esq.num);

  let firma = '';
  if (efectiva === 'inicio') {
    $('i-pildora').textContent = T('inicio_pildora');
    ajustarTexto($('i-pildora'), 960, 28, 16);
    $('i-ceja').textContent = T('inicio_ceja');
    $('i-ceja').classList.toggle('larga', $('i-ceja').textContent.length > 34);   // cejas largas: 22 px (S2InicioPatronalSector)
    $('i-titulo').textContent = T('inicio_titulo');
    $('i-cursiva').textContent = T('inicio_cursiva');
    const d = diasFaltan(s);
    $('i-cuenta').style.display = cuentaVisible(s) ? 'flex' : 'none';
    $('i-dias').textContent = d;
    $('i-cuenta-txt').textContent = T('inicio_cuenta');
    $('i-salida').hidden = !tipo.salida;
    $('i-salida-lugar').textContent = tipo.salida ? rellenar('{lugar}', s) : '';
    firma = 'inicio|' + s.tipo + '|' + src + '|' + $('i-pildora').textContent;
  }
  if (efectiva === 'portada') {
    if (esPortadaEvento) {
      // S2PortadaEvento: nombre del evento, caja con el día y el mes, y el lugar
      const f = fechaLocal(s.fecha);
      const lugar = String(s.lugar || '').trim();
      $('p-ceja').textContent = tipo.portadaCeja;
      $('p-cursiva').textContent = tipo.portadaCursiva;
      $('p-titulo').textContent = tituloCelebracion(s);
      $('p-caja').hidden = !f;
      $('p-caja-num').textContent = f ? String(f.getDate()) : '';
      $('p-caja-mes').textContent = f ? _MESES[f.getMonth()].slice(0, 3) : '';
      $('p-fecha').textContent = lugar;
      $('p-fecha').hidden = !lugar;
      $('p-sub').textContent = '';
      $('p-sub').hidden = true;
    } else {
      $('p-ceja').textContent = T('portada_ceja');
      $('p-cursiva').textContent = T('portada_cursiva');
      $('p-titulo').textContent = T('portada_titulo');
      const caja = cajaFiesta();             // { num, mes } o null si la parroquia no tiene fiesta
      const fecha = T('portada_fecha');
      $('p-caja').hidden = !caja;
      $('p-caja-num').textContent = caja ? caja.num : '';
      $('p-caja-mes').textContent = caja ? caja.mes : '';
      $('p-fecha').hidden = !fecha;
      $('p-fecha').textContent = fecha;
      $('p-sub').hidden = false;
      $('p-sub').textContent = T('portada_sub');
    }
    firma = 'portada|' + s.tipo + '|' + src;
  }
  if (efectiva === 'gracias') {
    $('g-pildora').textContent = T('gracias_pildora');
    ajustarTexto($('g-pildora'), 960, 28, 16);
    $('g-titulo').textContent = T('gracias_titulo');
    $('g-cursiva').textContent = T('gracias_cursiva');
    $('g-ceja').textContent = T('gracias_ceja');
    firma = 'gracias|' + s.tipo + '|' + src + '|' + $('g-pildora').textContent;
  }
  if (efectiva === 'avisos') {
    $('a-sub').textContent = T('avisos_sub');
    $('a-titulo').textContent = T('avisos_titulo');
    const filas = $('a-filas'); filas.innerHTML = '';
    const llenos = avisosPara(s, new Date());   // fijos vigentes de la configuración, luego los del panel; máximo 6
    const lista = llenos.length ? llenos : [{ a: 'Escriba los avisos en el panel', f: '' }];
    filas.classList.toggle('compacta', lista.length > 4);
    lista.forEach((x, i) => {
      const fila = document.createElement('div'); fila.className = 'fila';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = String(i + 1).padStart(2, '0');
      const a = document.createElement('span'); a.className = 'a'; a.textContent = x.a || '';
      const f = document.createElement('span'); f.className = 'f'; f.textContent = x.f || '';
      fila.append(n, a, f); filas.append(fila);
    });
    firma = 'avisos|' + src + '|' + JSON.stringify(lista);
  }
  if (efectiva === 'horarios') {
    $('h-sub').textContent = T('avisos_sub');
    $('h-titulo').textContent = T('horarios_titulo');
    const filas = $('h-filas'); filas.textContent = '';
    const horarios = horariosPara();
    const redes = redesPara();
    horarios.forEach((h) => {
      const fila = document.createElement('div'); fila.className = 'fila horario';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = h.hora || '';
      const a = document.createElement('span'); a.className = 'a'; a.textContent = h.dia || '';
      const f = document.createElement('span'); f.className = 'f'; f.textContent = h.nota;
      fila.append(n, a, f); filas.append(fila);
    });
    if (!horarios.length && !redes.length) {
      const fila = document.createElement('div'); fila.className = 'fila vacia';
      const a = document.createElement('span'); a.className = 'a'; a.textContent = 'Consulte los horarios en el panel';
      fila.append(a); filas.append(fila);
    }
    filas.classList.toggle('compacta', horarios.length > 4);
    filas.classList.toggle('dos-col', horarios.length > 6);
    const cajaRedes = $('h-redes'); cajaRedes.textContent = '';
    redes.forEach((r) => {   // solo el texto: la URL nunca se muestra
      const el = document.createElement('span'); el.className = 'red';
      const k = document.createElement('b'); k.textContent = NOMBRES_RED[r.red] || '';
      const x = document.createElement('span'); x.textContent = r.texto || '';
      el.append(k, x); cajaRedes.append(el);
    });
    cajaRedes.hidden = !redes.length;
    firma = 'horarios|' + src + '|' + JSON.stringify([horarios, redes]);
  }
  // volver a animar la entrada cuando cambia la celebración (no al escribir cada letra)
  if (firma !== firmaAnterior) {
    firmaAnterior = firma;
    const vistaEl = $('v-' + efectiva);
    if (efectiva === 'avisos') reanimar($('a-filas')); else if (efectiva === 'horarios') reanimar($('h-filas')); else if (vistaEl) reanimar(vistaEl);
  }
}

/* Fondo, distribución y elementos ocultos de esta pantalla: solo clases en el escenario (nunca estilos con datos
   sin validar). El color va en la variable --fondo-vista y solo si pasa RE_HEX. Una pantalla «como viene» no
   recibe ninguna clase. Si la imagen de fondo falla, se oculta y queda el degradado. */
const CLASES_AJUSTE = ['fondo-color', 'fondo-imagen', 'dist-derecha', 'dist-centro'].concat(ELEMENTOS_OCULTABLES.map((e) => 'oculto-' + e));
function aplicarAjustes(vista) {
  const esc = $('escenario');
  const a = ajustesDe(vista);
  esc.classList.remove(...CLASES_AJUSTE);
  esc.style.removeProperty('--fondo-vista');
  if (a.fondo.tipo === 'color' && RE_HEX.test(a.fondo.color)) {
    esc.style.setProperty('--fondo-vista', a.fondo.color);
    esc.classList.add('fondo-color');
  }
  const conImagen = a.fondo.tipo === 'imagen';
  if (conImagen) esc.classList.add('fondo-imagen');
  ponerImagen($('fondo-img'), conImagen ? a.fondo : null);
  if (a.distribucion === 'derecha' || a.distribucion === 'centro') esc.classList.add('dist-' + a.distribucion);
  ELEMENTOS_OCULTABLES.forEach((e) => { if (!visible(vista, e)) esc.classList.add('oculto-' + e); });
}

/* La configuración de la parroquia manda: colores, logos, fachada y el aviso de «no existe».
   Se aplica al cargar y cada vez que cambia la configuración (copia, servidor o 404). */
function aplicarParroquia(c) {
  const no = PARROQUIA_NO_EXISTE;
  $('escenario').classList.toggle('sin-parroquia', no);
  $('no-existe').hidden = !no;
  if (no) return;
  aplicarPaleta(c);
  ponerImagen($('fachada'), c.fachada);
  ponerImagen($('marca-logo'), c.logos && c.logos.blanco);
  ponerImagen($('aro-logo'), c.logos && c.logos.blanco);
  ponerImagen($('a-logo'), c.logos && c.logos.color);
  ponerImagen($('h-logo'), c.logos && c.logos.color);
  pintar(leerEstado());   // la firma de pintar no incluye la versión: sin cambios reales no se reanima la entrada
}
aplicarParroquia(PARROQUIA);
alCambiarParroquia(aplicarParroquia);
vigilarParroquia();
escucharEstado(pintar);
latir('pantalla-' + vista);
</script>
</body>
</html>
