<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pantalla – Parroquia</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="escenario" id="escenario">
<div class="no-existe" id="no-existe" hidden>Esta parroquia no existe, revisá el link</div>
<div class="lienzo" id="lienzo">
  <img class="fondo-img" id="fondo-img" alt="" hidden>
  <div class="brillo"></div>
  <img class="fachada" id="fachada" alt="" hidden>
  <div class="rayos"></div>
  <div id="chispas"></div>
  <img class="virgen virgen-entra" id="virgen" alt="" hidden>

  <div class="marca" id="marca">
    <img id="marca-logo" alt="" hidden>
    <div class="multilinea" id="t-marca"></div>
  </div>
  <div class="envivo" id="envivo"><i></i>EN VIVO</div>

  <!-- INICIO: en breve comenzamos -->
  <div class="texto" id="v-inicio" hidden>
    <span class="pildora" id="i-pildora"></span>
    <p class="ceja" id="i-ceja"></p>
    <h1 class="titulo"><span class="brilla multilinea" id="i-titulo"></span></h1>
    <p class="cursiva multilinea" id="i-cursiva"></p>
    <div class="cuenta" id="i-cuenta"><b id="i-dias"></b><span class="multilinea" id="i-cuenta-txt"></span></div>
    <div class="salida" id="i-salida" hidden><span>SALIDA</span><span id="i-salida-lugar"></span></div>
    <div class="extra" hidden></div>   <!-- redes, solo si la pantalla las pide (mostrar) -->
  </div>

  <!-- PORTADA 8 DE DICIEMBRE -->
  <div class="texto" id="v-portada" hidden style="gap:14px;top:140px">
    <p class="ceja" id="p-ceja" style="font-size:28px;letter-spacing:9px;margin:0"></p>
    <p class="cursiva" id="p-cursiva" style="font-size:calc(84px * var(--escala-frase,1));line-height:1;margin:0"></p>
    <h1 class="titulo" style="font-size:calc(112px * var(--escala-titulo,1))"><span class="brilla multilinea" id="p-titulo"></span></h1>
    <div class="dia8">
      <div class="caja" id="p-caja"><b id="p-caja-num">8</b><span id="p-caja-mes">DIC</span></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-weight:900;font-size:52px;letter-spacing:2px;line-height:1" id="p-fecha"></span>
        <span style="font-weight:600;font-size:26px;color:var(--tenue)" id="p-sub"></span>
      </div>
    </div>
  </div>

  <!-- Portada de evento: logo grande dentro de un aro (en lugar de la imagen de la celebración) -->
  <div class="aro" id="p-aro" hidden><img id="aro-logo" alt="" hidden></div>

  <!-- GRACIAS -->
  <div class="texto" id="v-gracias" hidden>
    <span class="pildora" id="g-pildora"></span>
    <h1 class="titulo" style="font-size:calc(88px * var(--escala-titulo,1));line-height:1;letter-spacing:-1px;margin-top:10px"><span class="brilla multilinea" id="g-titulo"></span></h1>
    <p class="cursiva multilinea" style="font-size:calc(60px * var(--escala-frase,1))" id="g-cursiva"></p>
    <p class="ceja" style="font-size:26px;letter-spacing:6px" id="g-ceja"></p>
    <div class="extra" hidden></div>   <!-- horarios y redes, solo si la pantalla los pide (mostrar) -->
  </div>

  <!-- AVISOS -->
  <div class="tarjeta" id="v-avisos" hidden>
    <div class="cab">
      <div><div class="sub" id="a-sub"></div><h1 id="a-titulo"></h1></div>
      <div style="display:flex;align-items:center;gap:16px">
        <span class="logo-redondo" id="a-logo-caja" hidden><img id="a-logo" alt="" hidden></span>
        <span class="envivo chico"><i></i>EN VIVO</span>
      </div>
    </div>
    <div class="filas" id="a-filas"></div>
  </div>

  <!-- HORARIOS DE MISA (y redes: solo el texto, OBS no hace clic) -->
  <div class="tarjeta" id="v-horarios" hidden>
    <div class="cab">
      <div><div class="sub" id="h-sub"></div><h1 id="h-titulo"></h1></div>
      <div style="display:flex;align-items:center;gap:16px">
        <span class="logo-redondo" id="h-logo-caja" hidden><img id="h-logo" alt="" hidden></span>
        <span class="envivo chico"><i></i>EN VIVO</span>
      </div>
    </div>
    <div class="filas" id="h-filas"></div>
    <div class="redes" id="h-redes"></div>
  </div>

  <div class="franja-entra" style="position:absolute;left:0;right:0;bottom:0;height:102px">
    <div class="franja-linea"></div>
    <div class="franja">
      <div class="borde"></div>
      <div class="frase"><i>✦</i><span id="frase"></span><i>✦</i></div>
      <div class="fecha" id="f-fecha"><b id="f-num"></b><span class="multilinea" id="f-txt"></span></div>
    </div>
  </div>
</div>
</div>

<script src="parroquia.js"></script>
<script src="tipos.js"></script>
<script src="comun.js"></script>
<script src="pantallas.js"></script>
<script>
const vista = (new URLSearchParams(location.search).get('tipo') || 'inicio').toLowerCase();
const $ = (id) => document.getElementById(id);
if (vista === 'avisos' || vista === 'horarios') { document.body.classList.add(vista); $('marca').style.display = 'none'; $('envivo').style.display = 'none'; }
// Gracias (F4:33) no lleva EN VIVO: la transmisión ya terminó.
if (vista === 'gracias') $('envivo').style.display = 'none';

/* Vista que se pinta de verdad: la portada solo existe para los tipos que la traen en tipos.js
   (portada: 'fiesta' | 'evento'); los demás pintan en ella la vista de Inicio. La URL no cambia. */
function vistaDe(s) {
  return vista === 'portada' && !tipoDe(s).portada ? 'inicio' : vista;
}

/* La imagen se pide una sola vez: si no carga (custodia.png, patrono…) cae a la fachada de la parroquia y no
   vuelve a intentarlo; si la fachada tampoco carga, la imagen se oculta y queda el degradado de los colores. */
function clasificarImagen(v) {
  v.classList.remove('a', 'b', 'c', 'foto', 'logo');
  v.classList.add(claseDeImagen(v.getAttribute('src') || ''));   // foto (fachada) | logo | a (vertical)
}
$('virgen').addEventListener('error', () => {
  const v = $('virgen');
  const r = respaldoDeImagen(v.getAttribute('src') || '');
  if (!r) { v.dataset.fallo = '1'; v.hidden = true; return; }
  aplicarEncuadre(v, null);   // la de reserva no es la foto que se encuadró
  v.setAttribute('src', r.src);
  v.alt = r.alt;
  clasificarImagen(v);
});

/* Encuadre { x, y, zoom } de una foto en su marco: object-position para moverla y, al acercar, object-view-box
   (recorta la foto alrededor del punto x, y antes de llenar el marco; el marco no cambia). null = el de siempre (CSS).
   En un navegador sin object-view-box la foto se mueve pero no se acerca. */
function aplicarEncuadre(img, e) {
  if (!e) { img.style.removeProperty('object-position'); img.style.removeProperty('object-view-box'); return; }
  img.style.setProperty('object-position', e.x + '% ' + e.y + '%');
  if (e.zoom > 100) {
    const k = 1 - 100 / e.zoom;
    const r = (n) => Math.round(n * 1000) / 1000 + '%';
    img.style.setProperty('object-view-box', 'inset(' + r(k * e.y) + ' ' + r(k * (100 - e.x)) + ' ' + r(k * (100 - e.y)) + ' ' + r(k * e.x) + ')');
  } else img.style.removeProperty('object-view-box');
}

/* chispas de luz que suben despacio */
(function () {
  const caja = $('chispas');
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('span');
    c.className = 'chispa';
    c.textContent = i % 3 === 0 ? '✦' : '•';
    c.style.left = (Math.random() * 1900) + 'px';
    c.style.top = (300 + Math.random() * 700) + 'px';
    c.style.fontSize = (i % 3 === 0 ? 12 + Math.random() * 14 : 8 + Math.random() * 10) + 'px';
    c.style.animationDuration = (9 + Math.random() * 10) + 's';
    c.style.animationDelay = (-Math.random() * 18) + 's';
    caja.append(c);
  }
})();

let firmaAnterior = '';
const NOMBRES_RED = { facebook: 'Facebook', youtube: 'YouTube', instagram: 'Instagram', whatsapp: 'WhatsApp', web: 'Web' };
/* Redes como texto (la URL nunca se muestra: OBS no hace clic). */
function llenarRedes(caja, redes) {
  caja.textContent = '';
  redes.forEach((r) => {
    const el = document.createElement('span'); el.className = 'red';
    const k = document.createElement('b'); k.textContent = NOMBRES_RED[r.red] || '';
    const x = document.createElement('span'); x.textContent = r.texto || '';
    el.append(k, x); caja.append(el);
  });
}
/* Caja .extra de Inicio y Gracias: horarios [{a, f}] (día y notas, horas) y redes. Sin nada, queda oculta. */
function pintarExtra(caja, horarios, redes) {
  caja.textContent = '';
  if (horarios.length) {
    const lista = document.createElement('div'); lista.className = 'horas';
    horarios.forEach((h) => {
      const el = document.createElement('span'); el.className = 'hora';
      const k = document.createElement('b'); k.textContent = h.a;
      const x = document.createElement('span'); x.textContent = h.f;
      el.append(k, x); lista.append(el);
    });
    caja.append(lista);
  }
  if (redes.length) {
    const r = document.createElement('div'); r.className = 'redes';
    llenarRedes(r, redes); caja.append(r);
  }
  caja.hidden = !horarios.length && !redes.length;
}
/* ¿Lo de adentro de la caja (.texto o .tarjeta) se sale de ella? Medidas de diseño (offset*), sin la escala del
   escenario; `abajo` es el relleno inferior de la caja. */
function seSale(caja, abajo = 0) {
  const hijos = [...caja.children].filter((e) => e.offsetParent !== null);
  if (!hijos.length) return false;
  const arriba = Math.min(...hijos.map((e) => e.offsetTop));
  const fondo = Math.max(...hijos.map((e) => e.offsetTop + e.offsetHeight));
  return arriba < 0 || fondo > caja.clientHeight - abajo + 0.5;
}
/* Tamaño del título y de la frase (tamanos de la pantalla). Es un techo: si lo elegido no cabe, se achica.
   1. Lo que se eligió más grande que lo normal vuelve hacia lo normal mientras algo se salga (a lo ancho o a lo alto):
      el tamaño cede antes que el contenido, así «Grande» nunca hace que se quiten horarios o redes.
   2. Una palabra más ancha que su cuadro (una letra ancha, un título largo): se achica bajo lo elegido.
   3. En Inicio, Portada y Gracias sin caja de horarios ni redes (no hay otra cosa que achicar): también a lo alto.
   Corre dentro de cada encaje (encajarExtra, encajarRedesAvisos, encajarHorarios), así reencajar lo repite al
   cargar una fuente. */
const ESCALAS_TAMANO = { 'muy-chico': 0.7, chico: 0.85, normal: 1, grande: 1.15 };
const ESCALA_MINIMA = 0.6;
let tamanosVista = { titulo: 'normal', frase: 'normal' };
function _anchoSeSale(v) {
  return [...v.querySelectorAll('h1, .cursiva')].some((e) => e.offsetParent !== null && e.scrollWidth > e.clientWidth + 1);
}
function encajarTitulos(v) {
  let t = ESCALAS_TAMANO[tamanosVista.titulo] || 1;
  let f = ESCALAS_TAMANO[tamanosVista.frase] || 1;
  const poner = () => { v.style.setProperty('--escala-titulo', String(t)); v.style.setProperty('--escala-frase', String(f)); };
  const bajar = (x, piso) => Math.max(piso, Math.round((x - 0.05) * 100) / 100);
  const abajo = parseFloat(getComputedStyle(v).paddingBottom) || 0;
  const alto = () => seSale(v, abajo);
  poner();
  while ((t > 1 || f > 1) && (_anchoSeSale(v) || alto())) { t = t > 1 ? bajar(t, 1) : t; f = f > 1 ? bajar(f, 1) : f; poner(); }
  while (_anchoSeSale(v) && (t > ESCALA_MINIMA || f > ESCALA_MINIMA)) { t = bajar(t, ESCALA_MINIMA); f = bajar(f, ESCALA_MINIMA); poner(); }
  const extra = v.querySelector('.extra');
  const sinExtras = v.classList.contains('texto') && (!extra || extra.hidden);
  while (sinExtras && alto() && (t > ESCALA_MINIMA || f > ESCALA_MINIMA)) { t = bajar(t, ESCALA_MINIMA); f = bajar(f, ESCALA_MINIMA); poner(); }
}

/* Caja .extra de Inicio y Gracias dentro de su texto: si no cabe, se compacta; si aún no cabe, deja fuera
   horarios desde el final y, como último recurso, redes. Nunca saca el título del cuadro ni pisa la franja. */
function encajarExtra(vistaEl, horarios, redes) {
  const caja = vistaEl.querySelector('.extra');
  const h = horarios.slice(); const r = redes.slice();
  caja.classList.remove('compacta');
  pintarExtra(caja, h, r);
  reencajar = () => encajarExtra(vistaEl, horarios, redes);
  encajarTitulos(vistaEl);
  if (caja.hidden || !seSale(vistaEl)) return;
  caja.classList.add('compacta');
  pintarExtra(caja, h, r);
  while ((h.length || r.length) && seSale(vistaEl)) {
    if (h.length) h.pop(); else r.pop();
    pintarExtra(caja, h, r);
  }
}
/* Tarjeta de Avisos que no cabe. Redes (#a-redes): van compactas (clase con-redes en la tarjeta). Pasos, en orden,
   hasta que quepa: 1. una lista sin compactar (avisos largos, detalle de 420) se compacta; 2. se dejan redes fuera
   desde el final. `compactaAntes` es lo que decidió pintar() por la cantidad de filas. */
function encajarRedesAvisos(redes, compactaAntes) {
  const t = $('v-avisos');
  const filas = $('a-filas');
  if (compactaAntes === undefined) compactaAntes = filas.classList.contains('compacta');
  filas.classList.toggle('compacta', compactaAntes);
  let caja = $('a-redes');
  if (redes.length && !caja) {
    caja = document.createElement('div'); caja.className = 'redes'; caja.id = 'a-redes';
    t.append(caja);
  }
  t.classList.toggle('con-redes', redes.length > 0);
  reencajar = () => encajarRedesAvisos(redes, compactaAntes);
  const r = redes.slice();
  if (caja) { llenarRedes(caja, r); caja.hidden = !r.length; }
  encajarTitulos(t);
  const abajo = parseFloat(getComputedStyle(t).paddingBottom) || 0;
  if (!compactaAntes && seSale(t, abajo)) filas.classList.add('compacta');
  if (!caja) return;
  while (r.length && seSale(t, abajo)) { r.pop(); llenarRedes(caja, r); }
  caja.hidden = !r.length;
}
/* Tarjeta de horarios (forma nueva) que no cabe. Pasos, en orden, hasta que quepa:
   1. se compacta la lista;
   2. el día toma el ancho de su nombre y el lugar y las notas (.f) se cortan a tres líneas (una, a dos
      columnas) con «…» (f-corta);
   3. redes más chicas;
   4. el lugar y las notas, a una línea y más chicos (f-una);
   5. se dejan redes fuera desde el final;
   6. último recurso: sin lugar ni notas (f-sin).
   Las filas de horarios no se quitan nunca. */
const CLASES_ENCAJE_HORARIOS = ['redes-chicas', 'f-corta', 'f-una', 'f-sin'];
function encajarHorarios(filas, cajaRedes, redes) {
  const t = $('v-horarios');
  const abajo = parseFloat(getComputedStyle(t).paddingBottom) || 0;
  const compactaAntes = filas.classList.contains('compacta');
  reencajar = () => {
    filas.classList.toggle('compacta', compactaAntes); t.classList.remove(...CLASES_ENCAJE_HORARIOS);
    llenarRedes(cajaRedes, redes); cajaRedes.hidden = !redes.length;
    encajarHorarios(filas, cajaRedes, redes);
  };
  const cabe = () => !seSale(t, abajo);
  encajarTitulos(t);
  if (cabe()) return;
  filas.classList.add('compacta');
  if (cabe()) return;
  t.classList.add('f-corta');
  if (cabe()) return;
  t.classList.add('redes-chicas');
  if (cabe()) return;
  t.classList.add('f-una');
  if (cabe()) return;
  const r = redes.slice();
  while (r.length && !cabe()) { r.pop(); llenarRedes(cajaRedes, r); }
  cajaRedes.hidden = !r.length;
  if (!cabe()) t.classList.add('f-sin');
}
/* Lo último que se encajó, para medirlo de nuevo cuando terminan de cargar las fuentes. */
let reencajar = () => {};
if (document.fonts) {
  document.fonts.addEventListener('loadingdone', () => reencajar());
  document.fonts.ready.then(() => reencajar());
}
function reanimar(el) { el.classList.remove('entra'); void el.offsetWidth; el.classList.add('entra'); }

function pintar(s) {
  if (PARROQUIA_NO_EXISTE) return;
  reencajar = () => {};
  const tipo = tipoDe(s);
  const efectiva = vistaDe(s);
  const esPortadaEvento = efectiva === 'portada' && tipo.portada === 'evento';
  // Ajustes, fondo y textos son los de la vista que se pinta de verdad: si la portada pinta Inicio, los del bloque `inicio`;
  // la portada de un tipo con portada de evento usa el bloque `evento` si la configuración lo trae; si no, el de
  // `portada`, como antes del bloque `evento` (una portada ya personalizada se sigue viendo igual).
  const conBloqueEvento = !!(PARROQUIA.pantallas && PARROQUIA.pantallas.evento && typeof PARROQUIA.pantallas.evento === 'object');
  const vistaCfg = esPortadaEvento && conBloqueEvento ? 'evento' : efectiva;
  const T = (clave) => textoDe(s, vistaCfg, clave);
  aplicarAjustes(vistaCfg);
  tamanosVista = ajustesDe(vistaCfg).tamanos;
  ['inicio', 'portada', 'gracias', 'avisos', 'horarios'].forEach((n) => { const el = $('v-' + n); if (el) el.hidden = (n !== efectiva); });

  const v = $('virgen');
  const im = imagenDeVista(s, efectiva);
  const src = im.src;
  if (v.dataset.pedida !== src) {
    v.dataset.pedida = src; v.dataset.fallo = '';
    if (src) v.setAttribute('src', src); else v.removeAttribute('src');
    clasificarImagen(v);
    v.classList.remove('virgen-entra'); void v.offsetWidth; v.classList.add('virgen-entra');
  }
  if (v.getAttribute('src') === src || !src) v.alt = im.alt;
  // el encuadre solo va con la foto que se encuadró y que de verdad se ve (no la de reserva)
  aplicarEncuadre(v, src && v.getAttribute('src') === src ? encuadreVisto(efectiva, 'imagen', fotoMostrada(s, efectiva)) : null);   // el alt se refresca en cada pintada (no si la imagen cayó a la fachada)
  // la portada de evento lleva el logo grande en su lugar; sin imagen (elección «ninguna» incluida) o con la imagen rota no se muestra nada
  v.hidden = esPortadaEvento || !v.getAttribute('src') || v.dataset.fallo === '1';
  $('p-aro').hidden = !esPortadaEvento;

  const franja = T('franja');
  $('frase').textContent = franja;
  $('frase').parentNode.style.visibility = franja ? '' : 'hidden';   // sin lema no hay franja (el espacio se conserva)
  $('t-marca').textContent = T('marca');
  const esq = esquinaDe(s);                  // { num, txt }: sin número solo se ve el texto
  $('f-num').textContent = esq.num;
  $('f-num').hidden = !esq.num;
  $('f-txt').textContent = esq.txt;
  $('f-fecha').classList.toggle('solo-texto', !esq.num);

  let firma = '';
  if (efectiva === 'inicio') {
    $('i-pildora').textContent = T('inicio_pildora');
    ajustarTexto($('i-pildora'), 960, 28, 16);
    $('i-ceja').textContent = T('inicio_ceja');
    $('i-ceja').classList.toggle('larga', $('i-ceja').textContent.length > 34);   // cejas largas: 22 px (S2InicioPatronalSector)
    $('i-titulo').textContent = T('inicio_titulo');
    $('i-cursiva').textContent = T('inicio_cursiva');
    const d = diasFaltan(s);
    $('i-cuenta').style.display = cuentaVisible(s) && visible(vistaCfg, 'cuenta') ? 'flex' : 'none';
    $('i-dias').textContent = d;
    $('i-cuenta-txt').textContent = T('inicio_cuenta');
    $('i-salida').hidden = !tipo.salida;
    $('i-salida-lugar').textContent = tipo.salida ? rellenar('{lugar}', s) : '';
    encajarExtra($('v-inicio'), [], redesVisibles(vistaCfg));
    firma = 'inicio|' + s.tipo + '|' + src + '|' + $('i-pildora').textContent;
  }
  if (efectiva === 'portada') {
    if (esPortadaEvento) {
      // S2PortadaEvento: nombre del evento, caja con el día y el mes, y el lugar
      const f = fechaLocal(s.fecha);
      const lugar = String(s.lugar || '').trim();
      $('p-ceja').textContent = tipo.portadaCeja;
      $('p-cursiva').textContent = tipo.portadaCursiva;
      $('p-titulo').textContent = tituloPortadaEvento(s);
      $('p-caja').hidden = !f;
      $('p-caja-num').textContent = f ? String(f.getDate()) : '';
      $('p-caja-mes').textContent = f ? _MESES[f.getMonth()].slice(0, 3) : '';
      $('p-fecha').textContent = lugar;
      $('p-fecha').hidden = !lugar;
      $('p-sub').textContent = '';
      $('p-sub').hidden = true;
    } else {
      $('p-ceja').textContent = T('portada_ceja');
      $('p-cursiva').textContent = T('portada_cursiva');
      $('p-titulo').textContent = T('portada_titulo');
      const caja = cajaFiesta();             // { num, mes } o null si la parroquia no tiene fiesta
      const fecha = T('portada_fecha');
      $('p-caja').hidden = !caja;
      $('p-caja-num').textContent = caja ? caja.num : '';
      $('p-caja-mes').textContent = caja ? caja.mes : '';
      $('p-fecha').hidden = !fecha;
      $('p-fecha').textContent = fecha;
      $('p-sub').hidden = false;
      $('p-sub').textContent = T('portada_sub');
    }
    encajarTitulos($('v-portada'));
    reencajar = () => encajarTitulos($('v-portada'));
    firma = 'portada|' + s.tipo + '|' + src;
  }
  if (efectiva === 'gracias') {
    $('g-pildora').textContent = T('gracias_pildora');
    ajustarTexto($('g-pildora'), 960, 28, 16);
    $('g-titulo').textContent = T('gracias_titulo');
    $('g-cursiva').textContent = T('gracias_cursiva');
    $('g-ceja').textContent = T('gracias_ceja');
    encajarExtra($('v-gracias'), visible(vistaCfg, 'horarios') ? filasGracias() : [], redesVisibles(vistaCfg));
    firma = 'gracias|' + s.tipo + '|' + src + '|' + $('g-pildora').textContent;
  }
  if (efectiva === 'avisos') {
    $('a-sub').textContent = T('avisos_sub');
    $('a-titulo').textContent = T('avisos_titulo');
    const filas = $('a-filas'); filas.innerHTML = '';
    const llenos = avisosPara(s, new Date());   // fijos vigentes de la configuración, luego los del panel; máximo 6
    const lista = llenos.length ? llenos : [{ a: 'Escriba los avisos en el panel', f: '' }];
    const redesAv = redesVisibles('avisos');
    filas.classList.toggle('compacta', lista.length > (redesAv.length ? 2 : 4));   // con redes debajo, se compacta antes
    lista.forEach((x, i) => {
      const fila = document.createElement('div'); fila.className = 'fila';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = String(i + 1).padStart(2, '0');
      const a = document.createElement('span'); a.className = 'a'; a.textContent = x.a || '';
      const f = document.createElement('span'); f.className = 'f'; f.textContent = x.f || '';
      fila.append(n, a, f); filas.append(fila);
    });
    // redes debajo de los avisos, solo si la pantalla las pide; la caja se crea al necesitarla
    encajarRedesAvisos(redesAv);
    firma = 'avisos|' + src + '|' + JSON.stringify([lista, redesAv]);
  }
  if (efectiva === 'horarios') {
    $('h-sub').textContent = T('avisos_sub');
    $('h-titulo').textContent = T('horarios_titulo');
    const filas = $('h-filas'); filas.textContent = '';
    const horarios = horariosPara();
    const redes = redesPara();
    // Con algún día de varias horas (.varias), cada hora va en su <span> y la píldora las pasa a otra línea dentro
    // de ella. Si todos los días tienen una hora (la forma vieja), la fila se arma y se ve como siempre.
    // Un día con más de dos horas (.muchas) compacta la lista y achica las horas para que quepan en dos líneas.
    const maxHoras = horarios.reduce((m, h) => Math.max(m, h.horas.length), 0);
    const varias = maxHoras > 1;
    filas.classList.toggle('varias', varias);
    filas.classList.toggle('muchas', maxHoras > 2);
    horarios.forEach((h) => {
      // horariosPara da {dia, horas:[{hora, nota}], lugar}; una hora sola (la forma vieja, sin lugar) se ve como siempre
      const unir = (l) => l.filter((t) => typeof t === 'string' && t !== '').join(' · ');
      const fila = document.createElement('div'); fila.className = 'fila horario';
      const n = document.createElement('span'); n.className = 'n';
      const horas = h.horas.map((o) => o.hora).filter((t) => typeof t === 'string' && t !== '');
      if (varias) {
        const caja = document.createElement('span'); caja.className = 'horas-n';
        horas.forEach((t, i) => {
          const e = document.createElement('span'); e.textContent = i < horas.length - 1 ? t + ' ·' : t;
          caja.append(e);
          if (i < horas.length - 1) caja.append(' ');
        });
        n.append(caja);
      } else {
        n.textContent = unir(horas);
      }
      const a = document.createElement('span'); a.className = 'a'; a.textContent = h.dia || '';
      // la misma nota en varias horas («Misa · Misa · Misa») se escribe una sola vez
      const notas = h.horas.map((o) => o.nota).filter((t, i, l) => l.indexOf(t) === i);
      const f = document.createElement('span'); f.className = 'f'; f.textContent = unir([h.lugar].concat(notas));
      fila.append(n, a, f); filas.append(fila);
    });
    filas.hidden = !horarios.length && !redes.length;   // sin nada que mostrar solo queda el título: ninguna instrucción al aire
    filas.classList.toggle('compacta', horarios.length > 4 || maxHoras > 2);
    filas.classList.toggle('dos-col', horarios.length > 6);
    const cajaRedes = $('h-redes');
    llenarRedes(cajaRedes, redes);
    cajaRedes.hidden = !redes.length;
    // Solo con la forma nueva (varias horas o lugar), que trae filas más altas: los horarios de una hora sin lugar
    // se ven exactamente como siempre.
    $('v-horarios').classList.remove(...CLASES_ENCAJE_HORARIOS);   // pintar siempre parte de la tarjeta sin encajar
    if (varias || horarios.some((h) => h.lugar)) encajarHorarios(filas, cajaRedes, redes);
    else { encajarTitulos($('v-horarios')); reencajar = () => encajarTitulos($('v-horarios')); }
    firma = 'horarios|' + src + '|' + JSON.stringify([horarios, redes]);
  }
  // volver a animar la entrada cuando cambia la celebración (no al escribir cada letra)
  if (firma !== firmaAnterior) {
    firmaAnterior = firma;
    const vistaEl = $('v-' + efectiva);
    if (efectiva === 'avisos') reanimar($('a-filas')); else if (efectiva === 'horarios') reanimar($('h-filas')); else if (vistaEl) reanimar(vistaEl);
  }
}

/* Fondo, distribución y elementos ocultos de esta pantalla: solo clases en el escenario (nunca estilos con datos
   sin validar). El color va en la variable --fondo-vista y solo si pasa RE_HEX. Una pantalla «como viene» no
   recibe ninguna clase. Si la imagen de fondo falla, se oculta y queda el degradado. */
const CLASES_AJUSTE = ['fondo-color', 'fondo-imagen', 'dist-derecha', 'dist-centro'].concat(ELEMENTOS_OCULTABLES.map((e) => 'oculto-' + e));
function aplicarAjustes(vista) {
  const esc = $('escenario');
  const a = ajustesDe(vista);
  esc.classList.remove(...CLASES_AJUSTE);
  esc.style.removeProperty('--fondo-vista');
  if (a.fondo.tipo === 'color' && RE_HEX.test(a.fondo.color)) {
    esc.style.setProperty('--fondo-vista', a.fondo.color);
    esc.classList.add('fondo-color');
  }
  const conImagen = a.fondo.tipo === 'imagen';
  if (conImagen) esc.classList.add('fondo-imagen');
  ponerImagen($('fondo-img'), conImagen ? a.fondo : null);
  aplicarEncuadre($('fondo-img'), conImagen ? encuadreVisto(vista, 'fondo', 'galeria:' + bloquePantalla(vista).fondo.imagen) : null);
  if (a.distribucion === 'derecha' || a.distribucion === 'centro') esc.classList.add('dist-' + a.distribucion);
  ELEMENTOS_OCULTABLES.forEach((e) => { if (!visible(vista, e)) esc.classList.add('oculto-' + e); });
}

/* estiloPantallas: clases letra-titulo-<clave>, letra-frase-<clave> y logo-chico|logo-grande en el escenario.
   Los valores de siempre no ponen clase, así la pantalla queda idéntica a la de antes. */
const CLASES_ESTILO = TIPOGRAFIAS.map((t) => 'letra-titulo-' + t).concat(LETRAS_FRASE.map((t) => 'letra-frase-' + t), ['logo-chico', 'logo-grande']);
function aplicarEstiloPantallas() {
  const esc = $('escenario');
  const e = estiloDe(vista);   // el de todas, con las letras propias de esta pantalla encima
  esc.classList.remove(...CLASES_ESTILO);
  if (e.letraTitulo !== 'montserrat') esc.classList.add('letra-titulo-' + e.letraTitulo);
  if (e.letraFrase !== 'vibes') esc.classList.add('letra-frase-' + e.letraFrase);
  if (e.logo !== 'normal') esc.classList.add('logo-' + e.logo);
}

/* Logo blanco de Avisos y Horarios en su círculo (F4:31): sin logo, o si no carga, el círculo entero se oculta. */
function ponerLogoRedondo(id, im) {
  const img = $(id); const caja = $(id + '-caja');
  if (!img.dataset.vigilaCaja) { img.dataset.vigilaCaja = '1'; img.addEventListener('error', () => { caja.hidden = true; }); }
  ponerImagen(img, im);
  caja.hidden = img.hidden;
}

/* La configuración de la parroquia manda: colores, logos, fachada y el aviso de «no existe».
   Se aplica al cargar y cada vez que cambia la configuración (copia, servidor o 404). */
function aplicarParroquia(c) {
  const no = PARROQUIA_NO_EXISTE;
  $('escenario').classList.toggle('sin-parroquia', no);
  $('no-existe').hidden = !no;
  if (no) return;
  aplicarPaleta(c);
  aplicarEstiloPantallas();
  ponerImagen($('fachada'), c.fachada);
  ponerImagen($('marca-logo'), c.logos && c.logos.blanco);
  ponerImagen($('aro-logo'), c.logos && c.logos.blanco);
  ponerLogoRedondo('a-logo', c.logos && c.logos.blanco);
  ponerLogoRedondo('h-logo', c.logos && c.logos.blanco);
  pintar(leerEstado());   // la firma de pintar no incluye la versión: sin cambios reales no se reanima la entrada
}
aplicarParroquia(PARROQUIA);
alCambiarParroquia(aplicarParroquia);
vigilarParroquia();
escucharEstado(pintar);
latir('pantalla-' + vista);
</script>
