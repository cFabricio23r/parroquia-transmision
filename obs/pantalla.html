<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pantalla – Parroquia</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="escenario">
<div class="lienzo" id="lienzo">
  <div class="brillo"></div>
  <img class="fachada" src="img/fachada.jpg" alt="">
  <div class="rayos"></div>
  <div id="chispas"></div>
  <img class="virgen virgen-entra" id="virgen" src="img/virgen-a.png" alt="">

  <div class="marca" id="marca">
    <img src="img/logo-blanco.png" alt="">
    <div class="multilinea" id="t-marca"></div>
  </div>
  <div class="envivo" id="envivo"><i></i>EN VIVO</div>

  <!-- INICIO: en breve comenzamos -->
  <div class="texto" id="v-inicio" hidden>
    <span class="pildora" id="i-pildora"></span>
    <p class="ceja" id="i-ceja"></p>
    <h1 class="titulo"><span class="brilla multilinea" id="i-titulo"></span></h1>
    <p class="cursiva multilinea" id="i-cursiva"></p>
    <div class="cuenta" id="i-cuenta"><b id="i-dias"></b><span class="multilinea" id="i-cuenta-txt"></span></div>
  </div>

  <!-- PORTADA 8 DE DICIEMBRE -->
  <div class="texto" id="v-portada" hidden style="gap:14px;top:140px">
    <p class="ceja" id="p-ceja" style="font-size:28px;letter-spacing:9px;margin:0"></p>
    <p class="cursiva" id="p-cursiva" style="font-size:84px;line-height:1;margin:0"></p>
    <h1 class="titulo" style="font-size:112px"><span class="brilla multilinea" id="p-titulo"></span></h1>
    <div class="dia8">
      <div class="caja"><b>8</b><span>DIC</span></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-weight:900;font-size:52px;letter-spacing:2px;line-height:1" id="p-fecha"></span>
        <span style="font-weight:600;font-size:26px;color:#bfe0ff" id="p-sub"></span>
      </div>
    </div>
  </div>

  <!-- GRACIAS -->
  <div class="texto" id="v-gracias" hidden>
    <span class="pildora" id="g-pildora"></span>
    <h1 class="titulo" style="font-size:88px;line-height:1;letter-spacing:-1px;margin-top:10px"><span class="brilla multilinea" id="g-titulo"></span></h1>
    <p class="cursiva multilinea" style="font-size:60px" id="g-cursiva"></p>
    <p class="ceja" style="font-size:26px;letter-spacing:6px" id="g-ceja"></p>
  </div>

  <!-- AVISOS -->
  <div class="tarjeta" id="v-avisos" hidden>
    <div class="cab">
      <div><div class="sub" id="a-sub"></div><h1 id="a-titulo"></h1></div>
      <div style="display:flex;align-items:center;gap:16px">
        <img src="img/logo-color.png" alt="" style="height:78px;display:block">
        <span class="envivo" style="position:static;font-size:22px;box-shadow:none"><i></i>EN VIVO</span>
      </div>
    </div>
    <div class="filas" id="a-filas"></div>
  </div>

  <div class="franja-entra" style="position:absolute;left:0;right:0;bottom:0;height:102px">
    <div class="franja-linea"></div>
    <div class="franja">
      <div class="borde"></div>
      <div class="frase"><i>✦</i><span id="frase"></span><i>✦</i></div>
      <div class="fecha"><b>8</b><span>DE<br>DICIEMBRE</span></div>
    </div>
  </div>
</div>
</div>

<script src="comun.js"></script>
<script>
const vista = (new URLSearchParams(location.search).get('tipo') || 'inicio').toLowerCase();
const $ = (id) => document.getElementById(id);
['inicio','portada','gracias','avisos'].forEach(v => { const el = $('v-' + v); if (el) el.hidden = (v !== vista); });
if (vista === 'avisos') { $('virgen').style.left = '10px'; $('virgen').style.bottom = '60px'; $('marca').style.display = 'none'; $('envivo').style.display = 'none'; }

/* chispas de luz que suben despacio */
(function () {
  const caja = $('chispas');
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('span');
    c.className = 'chispa';
    c.textContent = i % 3 === 0 ? '✦' : '•';
    c.style.left = (Math.random() * 1900) + 'px';
    c.style.top = (300 + Math.random() * 700) + 'px';
    c.style.fontSize = (i % 3 === 0 ? 12 + Math.random() * 14 : 8 + Math.random() * 10) + 'px';
    c.style.animationDuration = (9 + Math.random() * 10) + 's';
    c.style.animationDelay = (-Math.random() * 18) + 's';
    caja.append(c);
  }
})();

let firmaAnterior = '';
function reanimar(el) { el.classList.remove('entra'); void el.offsetWidth; el.classList.add('entra'); }

function pintar(s) {
  const v = $('virgen');
  const src = imagenVirgen(s);
  if (!v.src.endsWith(src)) { v.src = src; v.classList.remove('virgen-entra'); void v.offsetWidth; v.classList.add('virgen-entra'); }
  v.classList.remove('a', 'b', 'c'); v.classList.add(s.virgen);
  if (vista === 'avisos') v.style.height = s.virgen === 'c' ? '980px' : '900px';
  $('frase').textContent = s.frase || '';
  $('t-marca').textContent = tx(s, 'marca');

  let firma = '';
  if (vista === 'inicio') {
    $('i-pildora').textContent = tx(s, 'inicio_pildora');
    ajustarTexto($('i-pildora'), 960, 28, 16);
    $('i-ceja').textContent = tx(s, 'inicio_ceja');
    $('i-titulo').textContent = tx(s, 'inicio_titulo');
    $('i-cursiva').textContent = tx(s, 'inicio_cursiva');
    const d = diasFaltan(s);
    $('i-cuenta').style.display = (s.mostrarCuenta && s.tipo !== 'patronal' && d > 0) ? 'flex' : 'none';
    $('i-dias').textContent = d;
    $('i-cuenta-txt').textContent = tx(s, 'inicio_cuenta');
    firma = s.tipo + '|' + $('i-pildora').textContent;
  }
  if (vista === 'portada') {
    $('p-ceja').textContent = tx(s, 'portada_ceja');
    $('p-cursiva').textContent = tx(s, 'portada_cursiva');
    $('p-titulo').textContent = tx(s, 'portada_titulo');
    $('p-fecha').textContent = tx(s, 'portada_fecha');
    $('p-sub').textContent = tx(s, 'portada_sub');
    firma = 'portada';
  }
  if (vista === 'gracias') {
    $('g-pildora').textContent = tx(s, 'gracias_pildora');
    ajustarTexto($('g-pildora'), 960, 28, 16);
    $('g-titulo').textContent = tx(s, 'gracias_titulo');
    $('g-cursiva').textContent = tx(s, 'gracias_cursiva');
    $('g-ceja').textContent = tx(s, 'gracias_ceja');
    firma = s.tipo + '|' + $('g-pildora').textContent;
  }
  if (vista === 'avisos') {
    $('a-sub').textContent = tx(s, 'avisos_sub');
    $('a-titulo').textContent = tx(s, 'avisos_titulo');
    const filas = $('a-filas'); filas.innerHTML = '';
    const llenos = s.avisos.filter(x => (x.a || '').trim() || (x.f || '').trim());
    const lista = llenos.length ? llenos : [{ a: 'Escriba los avisos en el panel', f: '' }];
    lista.forEach((x, i) => {
      const fila = document.createElement('div'); fila.className = 'fila';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = String(i + 1).padStart(2, '0');
      const a = document.createElement('span'); a.className = 'a'; a.textContent = x.a || '';
      const f = document.createElement('span'); f.className = 'f'; f.textContent = x.f || '';
      fila.append(n, a, f); filas.append(fila);
    });
    firma = 'avisos|' + JSON.stringify(lista);
  }
  // volver a animar la entrada cuando cambia la celebración (no al escribir cada letra)
  if (firma !== firmaAnterior) {
    firmaAnterior = firma;
    const vistaEl = $('v-' + vista);
    if (vista === 'avisos') reanimar($('a-filas')); else if (vistaEl) reanimar(vistaEl);
  }
}

escucharEstado(pintar);
latir('pantalla-' + vista);
</script>
</body>
</html>
