<!-- Ícono 2.0, opción 1 (lienzo «App Android», «Íconos 2.0», Tarea 9f): la iglesia blanca del logo de
     Comunicaciones Ciudad Arce sobre el degradado azul, con el brillo arriba a la izquierda y el punto
     rojo en vivo con aro blanco arriba a la derecha. Medidas del lienzo, en su cuadro de 220.
     Fuente del ícono común. Los PNG se generan con `npm run iconos` (scripts/generar-iconos.js), que
     incrusta el logo (../portada/logo-blanco.png, 225×141) antes de rasterizar. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <!-- linear-gradient(150deg, …) de CSS: la línea pasa por el centro y mide 220 × (sen 150° + |cos 150°|). -->
    <linearGradient id="fondo" gradientUnits="userSpaceOnUse" x1="34.9" y1="-20.1" x2="185.1" y2="240.1">
      <stop offset="0" stop-color="#0c3562"/>
      <stop offset="0.55" stop-color="#1155a4"/>
      <stop offset="1" stop-color="#1f6fc4"/>
    </linearGradient>
    <!-- radial-gradient(circle, …) de un círculo de 220 corrido a (-44, -55): centro (66, 55) y radio
         hasta la esquina más lejana (155,6). -->
    <radialGradient id="brillo" gradientUnits="userSpaceOnUse" cx="66" cy="55" r="155.56">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="forma">
      <rect width="220" height="220" rx="49.5"/>
    </clipPath>
  </defs>
  <g clip-path="url(#forma)">
    <rect width="220" height="220" fill="url(#fondo)"/>
    <circle cx="66" cy="55" r="110" fill="url(#brillo)"/>
    <!-- El logo, al 62 % del ancho y centrado. -->
    <image href="../portada/logo-blanco.png" xlink:href="../portada/logo-blanco.png" x="41.8" y="67.26" width="136.4" height="85.48"/>
    <!-- El punto en vivo: 28,6 de diámetro, a 30,8 del borde, con aro blanco de 6,3. -->
    <circle cx="174.9" cy="45.1" r="20.59" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="174.9" cy="45.1" r="14.3" fill="#dd0300"/>
  </g>
</svg>
