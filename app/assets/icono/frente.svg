<!-- Primer plano del ícono adaptativo (108 dp), ícono 2.0 opción 1 (Tarea 9f): el logo y el punto en
     vivo del ícono común (cuadro de 220), achicados a 0,288 y centrados. Así lo más lejano, el aro
     del punto, llega a ~32,4 dp del centro: todo queda dentro de la zona segura, un círculo de 66 dp
     de diámetro. El logo mide ~39 dp de ancho. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="108" height="108" viewBox="0 0 108 108">
  <g transform="translate(54 54) scale(0.288) translate(-110 -110)">
    <image href="../portada/logo-blanco.png" xlink:href="../portada/logo-blanco.png" x="41.8" y="67.26" width="136.4" height="85.48"/>
    <circle cx="174.9" cy="45.1" r="20.59" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="174.9" cy="45.1" r="14.3" fill="#dd0300"/>
  </g>
</svg>
