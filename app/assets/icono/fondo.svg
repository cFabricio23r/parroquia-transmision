  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c3562"/>
      <stop offset="1" stop-color="#1f6fc4"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#fondo)"/>
</svg>
